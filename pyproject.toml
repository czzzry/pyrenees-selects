[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selects-preeditor"
version = "0.7.0"
description = "A local-first, LLM-assisted footage pre-editor with reversible decisions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Selects contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.scripts]
selects = "pyrenees_selects.cli:main"
selects-app = "pyrenees_selects.preeditor_server:main"

[tool.setuptools]
packages = ["pyrenees_selects"]

[tool.setuptools.package-data]
pyrenees_selects = ["static/*.html", "static/*.css", "static/*.js"]
