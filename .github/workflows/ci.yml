name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q pyrenees_selects scripts tests
      - run: node --check pyrenees_selects/static/app.js
      - run: node --check pyrenees_selects/static/preeditor.js
      - run: python -m pip install .
      - run: selects --help
