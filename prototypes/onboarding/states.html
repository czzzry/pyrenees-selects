<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Selects overnight states</title>
  <link rel="icon" href="../../pyrenees_selects/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="prototype"></main>
  <nav class="variant-switcher" aria-label="Overnight state references">
    <button id="previousState" type="button" aria-label="Previous state">←</button>
    <div><strong id="stateLabel">Running</strong><span>Use ← → to inspect states</span></div>
    <button id="nextState" type="button" aria-label="Next state">→</button>
  </nav>
  <script src="states.js"></script>
</body>
</html>
